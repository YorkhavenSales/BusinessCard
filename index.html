<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Business Card</title>

  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --brand: #1e3a8a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      width: min(100%, 560px);
      margin: 0 auto;
      padding: 20px 14px 36px;
    }

    /* Business card image */
    .business-card {
      background: var(--card);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
      margin-bottom: 16px;
    }

    .business-card img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Buttons */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;

      border-radius: 12px;
      border: 1px solid var(--line);

      background: #ffffff;
      color: var(--text);

      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
    }

    .btn.primary {
      grid-column: 1 / -1;
      background: var(--brand);
      color: #ffffff;
      border-color: var(--brand);
    }

    /* Contact information */
    .info {
      margin-top: 16px;
      background: #ffffff;
      border-radius: 14px;
      padding: 6px 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
    }

    .row {
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }

    .row:last-child {
      border-bottom: none;
    }

    .label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .value {
      font-size: 15px;
      line-height: 1.5;
      word-break: break-word;
    }

    .loading {
      padding: 20px 0;
      text-align: center;
      color: var(--muted);
    }

    .footer {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 390px) {

      .actions {
        grid-template-columns: 1fr;
      }

      .btn.primary {
        grid-column: auto;
      }

    }

  </style>
</head>


<body>

  <main class="wrap">


    <!-- Business card image -->
    <section class="business-card">

      <img
        src="business-card.png"
        alt="Business Card"
      >

    </section>


    <!-- Action buttons -->
    <section class="actions">

      <a
        id="callButton"
        class="btn"
        href="#"
      >
        Call
      </a>


      <a
        id="emailButton"
        class="btn"
        href="#"
      >
        Email
      </a>


      <a
        id="whatsappButton"
        class="btn"
        href="#"
        target="_blank"
        rel="noopener"
      >
        WhatsApp
      </a>


      <a
        id="mapButton"
        class="btn"
        href="#"
        target="_blank"
        rel="noopener"
      >
        Map
      </a>


      <a
        class="btn primary"
        href="justin-park.vcf"
        download
      >
        Save Contact
      </a>

    </section>



    <!-- Contact information -->
    <section class="info">

      <div
        id="loading"
        class="loading"
      >
        Loading contact...
      </div>


      <div
        id="contactInfo"
        style="display: none;"
      >


        <div class="row">

          <span class="label">
            Name
          </span>

          <div
            id="name"
            class="value"
          ></div>

        </div>



        <div class="row">

          <span class="label">
            Title
          </span>

          <div
            id="title"
            class="value"
          ></div>

        </div>



        <div class="row">

          <span class="label">
            Company
          </span>

          <div
            id="company"
            class="value"
          ></div>

        </div>



        <div class="row">

          <span class="label">
            Phone
          </span>

          <div
            id="phone"
            class="value"
          ></div>

        </div>



        <div class="row">

          <span class="label">
            Email
          </span>

          <div
            id="email"
            class="value"
          ></div>

        </div>



        <div class="row">

          <span class="label">
            Office
          </span>

          <div
            id="address"
            class="value"
          ></div>

        </div>


      </div>

    </section>


    <div
      id="footer"
      class="footer"
    >
      The York Haven Company
    </div>


  </main>



  <script>

    /*
      Decode escaped vCard characters
    */
    function unescapeVCard(value) {

      if (!value) {
        return "";
      }

      return value
        .replace(/\\n/gi, "\n")
        .replace(/\\,/g, ",")
        .replace(/\\;/g, ";")
        .replace(/\\\\/g, "\\")
        .trim();

    }



    /*
      Find a value such as:
      FN
      ORG
      TITLE
      TEL
      EMAIL
      ADR
    */
    function findVCardValue(lines, key) {

      const upperKey = key.toUpperCase();

      const line = lines.find(function(line) {

        const upperLine = line.toUpperCase();

        return (
          upperLine.startsWith(upperKey + ":") ||
          upperLine.startsWith(upperKey + ";")
        );

      });


      if (!line) {
        return "";
      }


      const colonPosition = line.indexOf(":");


      if (colonPosition === -1) {
        return "";
      }


      return line.substring(colonPosition + 1);

    }



    /*
      Split ADR while respecting escaped semicolons
    */
    function splitVCardAddress(value) {

      const result = [];

      let current = "";
      let escaped = false;


      for (let i = 0; i < value.length; i++) {

        const char = value[i];


        if (escaped) {

          current += char;
          escaped = false;
          continue;

        }


        if (char === "\\") {

          current += char;
          escaped = true;
          continue;

        }


        if (char === ";") {

          result.push(
            unescapeVCard(current)
          );

          current = "";
          continue;

        }


        current += char;

      }


      result.push(
        unescapeVCard(current)
      );


      return result;

    }



    /*
      Parse vCard ADR

      ADR structure:

      PO Box;
      Extended Address;
      Street Address;
      Locality;
      Region;
      Postal Code;
      Country
    */
    function parseAddress(rawAddress) {


      if (!rawAddress) {

        return {
          display: "",
          search: ""
        };

      }


      const parts =
        splitVCardAddress(rawAddress);


      const poBox =
        parts[0] || "";

      const extended =
        parts[1] || "";

      const street =
        parts[2] || "";

      const city =
        parts[3] || "";

      const region =
        parts[4] || "";

      const postalCode =
        parts[5] || "";

      const country =
        parts[6] || "";


      /*
        Website display

        Shows full address including:
        Jung-Hae Bldg 301
      */
      const displayParts = [

        street,
        extended,
        city,
        region,
        postalCode,
        country

      ].filter(Boolean);



      /*
        Google Maps search

        Does NOT include:
        Jung-Hae Bldg 301

        Example:

        24 Samseong-ro 99-gil,
        Gangnam District,
        Seoul,
        South Korea
      */
      const mapParts = [

        street,
        city,
        region,
        postalCode,
        country

      ].filter(Boolean);



      return {

        display:
          displayParts.join(", "),

        search:
          mapParts.join(", ")

      };

    }



    /*
      Load vCard
    */
    async function loadContact() {


      try {


        /*
          Timestamp prevents browser caching
          of an old VCF file.
        */
        const response = await fetch(

          "justin-park.vcf?v=" +
          Date.now()

        );


        if (!response.ok) {

          throw new Error(
            "Unable to load justin-park.vcf"
          );

        }



        const text =
          await response.text();



        /*
          Split file into lines
        */
        const rawLines =
          text.split(/\r?\n/);



        /*
          Handle folded vCard lines
        */
        const lines = [];


        rawLines.forEach(function(line) {


          if (
            /^[ \t]/.test(line) &&
            lines.length > 0
          ) {

            lines[
              lines.length - 1
            ] += line.substring(1);

          }

          else {

            lines.push(line);

          }


        });



        /*
          Read contact information
        */

        const name =
          unescapeVCard(
            findVCardValue(
              lines,
              "FN"
            )
          );


        const title =
          unescapeVCard(
            findVCardValue(
              lines,
              "TITLE"
            )
          );


        const company =
          unescapeVCard(
            findVCardValue(
              lines,
              "ORG"
            )
          );


        const phone =
          unescapeVCard(
            findVCardValue(
              lines,
              "TEL"
            )
          );


        const email =
          unescapeVCard(
            findVCardValue(
              lines,
              "EMAIL"
            )
          );


        const rawAddress =
          findVCardValue(
            lines,
            "ADR"
          );


        const address =
          parseAddress(
            rawAddress
          );



        /*
          Display information
        */

        document
          .getElementById("name")
          .textContent = name;


        document
          .getElementById("title")
          .textContent = title;


        document
          .getElementById("company")
          .textContent = company;


        document
          .getElementById("phone")
          .textContent = phone;


        document
          .getElementById("email")
          .textContent = email;


        document
          .getElementById("address")
          .textContent = address.display;



        /*
          Browser tab title
        */
        if (name) {

          document.title =
            name +
            (
              company
                ? " | " + company
                : ""
            );

        }



        /*
          Footer
        */
        if (company) {

          document
            .getElementById("footer")
            .textContent = company;

        }



        /*
          Call button
        */
        const callButton =
          document.getElementById(
            "callButton"
          );


        if (phone) {

          const telephoneNumber =
            phone.replace(
              /[^\d+]/g,
              ""
            );


          callButton.href =
            "tel:" +
            telephoneNumber;

        }

        else {

          callButton.style.display =
            "none";

        }



        /*
          Email button
        */
        const emailButton =
          document.getElementById(
            "emailButton"
          );


        if (email) {

          emailButton.href =
            "mailto:" +
            email;

        }

        else {

          emailButton.style.display =
            "none";

        }



        /*
          WhatsApp button
        */
        const whatsappButton =
          document.getElementById(
            "whatsappButton"
          );


        if (phone) {

          const whatsappNumber =
            phone.replace(
              /\D/g,
              ""
            );


          whatsappButton.href =
            "https://wa.me/" +
            whatsappNumber;

        }

        else {

          whatsappButton.style.display =
            "none";

        }



        /*
          Google Maps button

          IMPORTANT:
          address.search does not contain
          building name or room number.
        */
        const mapButton =
          document.getElementById(
            "mapButton"
          );


        if (address.search) {

          mapButton.href =
            "https://www.google.com/maps/search/?api=1&query=" +
            encodeURIComponent(
              address.search
            );

        }

        else {

          mapButton.style.display =
            "none";

        }



        /*
          Hide loading text
        */
        document
          .getElementById("loading")
          .style.display = "none";


        document
          .getElementById("contactInfo")
          .style.display = "block";


      }

      catch (error) {


        console.error(error);


        document
          .getElementById("loading")
          .textContent =
            "Unable to load contact information.";


      }

    }



    /*
      Start
    */
    loadContact();

  </script>


</body>

</html>
