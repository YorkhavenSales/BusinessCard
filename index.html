<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Business Card | The York Haven Company</title>

  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --brand: #1e3a8a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      width: min(100%, 560px);
      margin: 0 auto;
      padding: 20px 14px 36px;
    }

    /* 명함 이미지 */
    .business-card {
      background: var(--card);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0,0,0,.08);
      margin-bottom: 16px;
    }

    .business-card img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 버튼 */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;

      border-radius: 12px;
      border: 1px solid var(--line);

      background: white;
      color: var(--text);

      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
    }

    .btn.primary {
      grid-column: 1 / -1;
      background: var(--brand);
      color: white;
      border-color: var(--brand);
    }

    /* 연락처 정보 */
    .info {
      margin-top: 16px;
      background: white;
      border-radius: 14px;
      padding: 6px 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,.05);
    }

    .row {
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }

    .row:last-child {
      border-bottom: none;
    }

    .label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 4px;
    }

    .value {
      font-size: 15px;
      line-height: 1.45;
      word-break: break-word;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: var(--muted);
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 18px;
    }

    @media (max-width: 390px) {
      .actions {
        grid-template-columns: 1fr;
      }

      .btn.primary {
        grid-column: auto;
      }
    }
  </style>
</head>


<body>

<main class="wrap">

  <!-- 명함 이미지 -->
  <section class="business-card">
    <img src="card.png" alt="Business Card">
  </section>


  <!-- 버튼 -->
  <section class="actions">

    <a id="callButton"
       class="btn"
       href="#">
       Call
    </a>

    <a id="emailButton"
       class="btn"
       href="#">
       Email
    </a>

    <a id="whatsappButton"
       class="btn"
       href="#"
       target="_blank"
       rel="noopener">
       WhatsApp
    </a>

    <a id="mapButton"
       class="btn"
       href="#"
       target="_blank"
       rel="noopener">
       Map
    </a>

    <a class="btn primary"
       href="justin-park.vcf"
       download>
       Save Contact
    </a>

  </section>


  <!-- 연락처 정보 -->
  <section class="info">

    <div id="loading" class="loading">
      Loading contact...
    </div>


    <div id="contactInfo" style="display:none;">

      <div class="row">
        <span class="label">Name</span>
        <div id="name" class="value"></div>
      </div>


      <div class="row">
        <span class="label">Title</span>
        <div id="title" class="value"></div>
      </div>


      <div class="row">
        <span class="label">Company</span>
        <div id="company" class="value"></div>
      </div>


      <div class="row">
        <span class="label">Phone</span>
        <div id="phone" class="value"></div>
      </div>


      <div class="row">
        <span class="label">Email</span>
        <div id="email" class="value"></div>
      </div>


      <div class="row">
        <span class="label">Office</span>
        <div id="address" class="value"></div>
      </div>

    </div>

  </section>


  <div id="footer" class="footer">
    The York Haven Company
  </div>

</main>


<script>

  /* -------------------------------------
     vCard 문자열의 이스케이프 문자 정리
  ------------------------------------- */
  function unescapeVCard(value) {

    if (!value) {
      return "";
    }

    return value
      .replace(/\\n/gi, "\n")
      .replace(/\\,/g, ",")
      .replace(/\\;/g, ";")
      .replace(/\\\\/g, "\\")
      .trim();
  }


  /* -------------------------------------
     vCard에서 특정 항목 찾기
  ------------------------------------- */
  function findVCardValue(lines, key) {

    const line = lines.find(line => {

      const upper = line.toUpperCase();

      return (
        upper.startsWith(key + ":") ||
        upper.startsWith(key + ";")
      );

    });


    if (!line) {
      return "";
    }


    const colonIndex = line.indexOf(":");

    if (colonIndex === -1) {
      return "";
    }


    return unescapeVCard(
      line.substring(colonIndex + 1)
    );

  }


  /* -------------------------------------
     ADR 주소 파싱
  ------------------------------------- */
  function parseAddress(rawAddress) {

    if (!rawAddress) {
      return {
        display: "",
        search: ""
      };
    }


    /*
      ADR 구조

      PO Box;
      Extended Address;
      Street;
      Locality;
      Region;
      Postal Code;
      Country
    */

    const parts = rawAddress
      .split(/(?<!\\);/)
      .map(part => unescapeVCard(part));


    const [
      poBox,
      extended,
      street,
      city,
      region,
      postalCode,
      country
    ] = parts;


    const addressParts = [
      extended,
      street,
      city,
      region,
      postalCode,
      country
    ].filter(Boolean);


    return {

      display: addressParts.join(", "),

      search: addressParts.join(", ")

    };

  }


  /* -------------------------------------
     VCF 불러오기
  ------------------------------------- */
  async function loadContact() {

    try {

      /*
        캐시 방지용 query parameter
        VCF 수정 후 오래된 파일이 보이는 문제 감소
      */
      const response = await fetch(
        "justin-park.vcf?v=" + Date.now()
      );


      if (!response.ok) {

        throw new Error(
          "VCF file could not be loaded."
        );

      }


      const vcfText = await response.text();


      /*
        줄바꿈 처리
      */
      const rawLines = vcfText.split(/\r?\n/);


      /*
        vCard folded line 처리

        이전 줄 다음에 공백으로 시작하는 줄이
        이어지는 경우 하나로 합침.
      */
      const lines = [];

      rawLines.forEach(line => {

        if (
          /^[ \t]/.test(line) &&
          lines.length > 0
        ) {

          lines[lines.length - 1] +=
            line.substring(1);

        } else {

          lines.push(line);

        }

      });


      /* 연락처 읽기 */

      const name =
        findVCardValue(lines, "FN");

      const title =
        findVCardValue(lines, "TITLE");

      const company =
        findVCardValue(lines, "ORG");

      const phone =
        findVCardValue(lines, "TEL");

      const email =
        findVCardValue(lines, "EMAIL");

      const rawAddress =
        findVCardValue(lines, "ADR");


      const address =
        parseAddress(rawAddress);


      /* -------------------------------------
         화면에 값 표시
      ------------------------------------- */

      document.getElementById("name")
        .textContent = name;

      document.getElementById("title")
        .textContent = title;

      document.getElementById("company")
        .textContent = company;

      document.getElementById("phone")
        .textContent = phone;

      document.getElementById("email")
        .textContent = email;

      document.getElementById("address")
        .textContent = address.display;


      /* -------------------------------------
         페이지 제목 자동 변경
      ------------------------------------- */

      if (name) {

        document.title =
          name +
          (company ? " | " + company : "");

      }


      /* -------------------------------------
         Footer 회사명 자동 변경
      ------------------------------------- */

      if (company) {

        document.getElementById("footer")
          .textContent = company;

      }


      /* -------------------------------------
         Call 버튼
      ------------------------------------- */

      const callButton =
        document.getElementById("callButton");

      if (phone) {

        callButton.href =
          "tel:" +
          phone.replace(/[^\d+]/g, "");

      } else {

        callButton.style.display = "none";

      }


      /* -------------------------------------
         Email 버튼
      ------------------------------------- */

      const emailButton =
        document.getElementById("emailButton");

      if (email) {

        emailButton.href =
          "mailto:" + email;

      } else {

        emailButton.style.display = "none";

      }


      /* -------------------------------------
         WhatsApp 버튼

         WhatsApp URL에는 +나 - 없이
         숫자만 사용
      ------------------------------------- */

      const whatsappButton =
        document.getElementById(
          "whatsappButton"
        );


      if (phone) {

        const whatsappNumber =
          phone.replace(/\D/g, "");


        whatsappButton.href =
          "https://wa.me/" +
          whatsappNumber;

      } else {

        whatsappButton.style.display = "none";

      }


      /* -------------------------------------
         Google Maps 버튼
      ------------------------------------- */

      const mapButton =
        document.getElementById("mapButton");


      if (address.search) {

        mapButton.href =
          "https://www.google.com/maps/search/?api=1&query=" +
          encodeURIComponent(
            address.search
          );

      } else {

        mapButton.style.display = "none";

      }


      /* Loading 숨기고 정보 표시 */

      document.getElementById("loading")
        .style.display = "none";

      document.getElementById("contactInfo")
        .style.display = "block";


    } catch (error) {

      console.error(error);


      document.getElementById("loading")
        .textContent =
        "Unable to load contact information.";

    }

  }


  /* 페이지가 열리면 실행 */

  loadContact();

</script>

</body>
</html>
