<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>Justin Park | The York Haven Company</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --brand: #1e3a8a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      width: min(100%, 560px);
      margin: 0 auto;
      padding: 20px 14px 36px;
    }

    .business-card {
      background: var(--card);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0,0,0,.08);
      margin-bottom: 16px;
    }

    .business-card img {
      display: block;
      width: 100%;
      height: auto;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .btn.primary {
      grid-column: 1 / -1;
      background: var(--brand);
      color: white;
      border-color: var(--brand);
    }

    .info {
      margin-top: 16px;
      background: #fff;
      border-radius: 14px;
      padding: 6px 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,.05);
    }

    .row {
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }

    .row:last-child { border-bottom: none; }

    .label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 4px;
    }

    .value {
      font-size: 15px;
      line-height: 1.45;
      word-break: break-word;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 18px;
    }

    @media (max-width: 390px) {
      .actions { grid-template-columns: 1fr; }
      .btn.primary { grid-column: auto; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="business-card">
      <img src="business-card.png" alt="Justin Park business card">
    </section>

    <section class="actions">
      <a class="btn" href="tel:+821033706166">Call</a>
      <a class="btn" href="mailto:justin.park@theyorkhavencompany.com">Email</a>
      <a class="btn" href="https://wa.me/821033706166" target="_blank" rel="noopener">WhatsApp</a>
      <a class="btn" href="https://www.google.com/maps/search/?api=1&query=6364+Creekbend+Drive%2C+Mechanicsburg%2C+PA+17050" target="_blank" rel="noopener">Map</a>
      <a class="btn primary" href="justin-park.vcf" download>Save Contact</a>
    </section>

    <section class="info">
      <div class="row">
        <span class="label">Name</span>
        <div class="value">Justin Park</div>
      </div>
      <div class="row">
        <span class="label">Title</span>
        <div class="value">Principal &amp; Founder</div>
      </div>
      <div class="row">
        <span class="label">Company</span>
        <div class="value">The York Haven Company</div>
      </div>
      <div class="row">
        <span class="label">Phone</span>
        <div class="value">+82-10-3370-6166</div>
      </div>
      <div class="row">
        <span class="label">Email</span>
        <div class="value">justin.park@theyorkhavencompany.com</div>
      </div>
      <div class="row">
        <span class="label">Office</span>
        <div class="value">York Haven US<br>6364 Creekbend Drive,<br>Mechanicsburg, PA 17050</div>
      </div>
    </section>

    <div class="footer">The York Haven Company</div>
  </main>
</body>
</html>
